name: expensy
description: A fully offline expense manager with Material You design.
publish_to: 'none'
version: 1.2.2+19

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4
  path: ^1.9.0
  path_provider: ^2.1.4
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.0
  file_picker: ^13.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  excel: ^4.0.6
  http: ^1.2.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  google_fonts: '>=8.2.1 <9.0.0'
  dynamic_color: '>=1.9.0 <2.0.0'
  cupertino_icons: ^2.0.0
  archive: ^3.6.1
  home_widget: ^0.10.0
  package_info_plus: ^10.2.1
  collection: ^1.18.0
  shimmer: ^4.0.0
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.6.0+eol
  pdf: ^3.12.0
  printing: ^5.14.3
  cryptography: ^2.7.0
  workmanager: ^0.5.2
  expensy_saf:
    path: plugins/expensy_saf

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/splash_icon.png

dependency_overrides:
  home_widget:
    path: plugins/home_widget
  workmanager:
    path: plugins/workmanager
