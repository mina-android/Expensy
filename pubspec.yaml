name: expensy
description: A fully offline expense manager with Material You design.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  fl_chart: ^0.68.0
  intl: ^0.19.0
  uuid: ^4.5.0
  file_picker: ^8.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  excel: ^4.0.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash_icon.png
