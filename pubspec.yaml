name: expensy
description: A fully offline expense manager with Material You design.
publish_to: 'none'
version: 1.2.0+13

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.4
  path: ^1.9.0
  path_provider: ^2.1.4
  fl_chart: ^1.2.0
  intl: ^0.20.2
  uuid: ^4.5.0
  file_picker: ^13.1.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  excel: ^4.0.6
  http: ^1.2.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  google_fonts: ^8.2.1
  dynamic_color: 1.8.1
  cupertino_icons: ^1.0.8
  archive: ^3.6.1
  home_widget: ^0.10.0
  package_info_plus: ^10.2.1
  shimmer: ^4.0.0
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.6.0+eol
  pdf: ^3.10.8
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/splash_icon.png
