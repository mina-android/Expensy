name: expensy
description: A fully offline expense manager with Material You design.
publish_to: 'none'
version: 1.0.7+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  fl_chart: ^0.68.0
  intl: ^0.20.2
  uuid: ^4.5.0
  file_picker: ^8.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  excel: ^4.0.6
  http: ^1.2.0
  url_launcher: ^6.3.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  dynamic_color: ^1.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/splash_icon.png
